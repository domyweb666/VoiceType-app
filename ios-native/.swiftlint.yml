# SwiftLint（Level 2 可驗證規則）。CI 用 `swiftlint --strict` 強制。
# 能被這裡抓到的，不寫進 .vibe/規矩檔.md。
included:
  - .
excluded:
  - .build
  - DerivedData

opt_in_rules:
  - cyclomatic_complexity
  - function_body_length
  - file_length
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - closure_spacing
  - sorted_imports
  - explicit_init
  - fatal_error_message
  - discouraged_optional_boolean
  - todo

analyzer_rules:
  - unused_declaration
  - unused_import

function_body_length:
  warning: 40
  error: 60
cyclomatic_complexity:
  warning: 10
  error: 15
file_length:
  warning: 300
  error: 400
line_length:
  warning: 100
  error: 120
  ignores_comments: true
type_body_length:
  warning: 200
  error: 300
identifier_name:
  min_length: 3
  excluded:
    - id
    - x
    - y
    - db
    - ms
    # Tokens.swift 的六個間距刻度（設計代號，不改名）
    - xs
    - s
    - m
    - l
    - xl
    - xxl

# 規矩檔第 3 節：錯誤要大聲
force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional: error
todo: error

custom_rules:
  no_print:
    name: "不准 print / NSLog / debugPrint"
    regex: '^\s*(print|NSLog|debugPrint)\('
    message: "用 os.Logger，而且金鑰、錄音、口語稿、文字稿不准進 log（規矩檔第 3 節）"
    severity: error
  no_empty_catch:
    name: "不准空的 catch"
    regex: 'catch\s*(\w+\s*)?\{\s*\}'
    message: "錯誤不准默默吞（規矩檔第 3 節）"
    severity: error
  no_combine:
    name: "不用 Combine"
    regex: '^\s*import Combine'
    message: "用 async/await，不用 Combine（規矩檔第 1 節）"
    severity: error
  no_insecure_http:
    name: "只准 https"
    regex: '"http://'
    message: "只連 https://api.openai.com（安全標準三）"
    severity: error
  # 以下四條：畫面寫死數值檢查（.uiux/05-設計代號/使用規則.md 最後一節）。Tokens.swift 是唯一例外。
  no_hardcoded_color:
    name: "畫面不准寫死顏色"
    regex: '#[0-9A-Fa-f]{3,8}\b|Color\(red:|Color\(hex:|UIColor\(red:|Color\(\.sRGB|Color\(white:'
    excluded: ".*Tokens\\.swift"
    message: "顏色只准用 Token.Colors（使用規則第 1 條）"
    severity: error
  no_hardcoded_font_size:
    name: "畫面不准寫死字級"
    regex: '\.font\(\.system\(size:|Font\.system\(size:'
    excluded: ".*Tokens\\.swift"
    message: "字級只准用 Token.Fonts，跟著系統字級走（使用規則第 5 條）"
    severity: error
  no_hardcoded_spacing:
    name: "畫面不准寫死間距與圓角"
    regex: '\.padding\((\.[a-zA-Z]+, *)?[0-9]|cornerRadius: *[0-9]|spacing: *[0-9]'
    excluded: ".*Tokens\\.swift"
    message: "間距與圓角只准用 Token.Space／Token.Shape（使用規則第 1 條）"
    severity: error
  no_hardcoded_duration:
    name: "畫面不准寫死動畫秒數"
    regex: 'duration: *[0-9]'
    excluded: ".*Tokens\\.swift"
    message: "動畫只准用 Token.Motion（使用規則第 1 條）"
    severity: error
