# 米說 iOS（SwiftUI）的專案描述檔。Xcode 專案不進 repo，CI 用 XcodeGen 照這份產生。
# 名稱、Bundle ID、部署目標與 ios/README-release.md 的上架設定一致，片 A3 接簽章時不用改。
name: MiSay

options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "17.0" # 2026-10-31 米定：Tokens 的彈簧動畫與觸覺回饋是 iOS 17 的寫法

targets:
  MiSay:
    type: application
    platform: iOS
    sources:
      - MiSay
    # Info.plist 由 XcodeGen 每次產生（不進 repo）。麥克風說明是片 C2 的事，這裡不放。
    info:
      path: MiSay/Info.plist
      properties:
        CFBundleDisplayName: 米說
        # 版本與 build 號由 CI 從 tag 與流水號帶入（ios-release.yml）；本機預設值只是佔位
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 只用 HTTPS，出口合規免申報；沒這行每個 build 都要進 App Store Connect 手動回答
        ITSAppUsesNonExemptEncryption: false
        # 2026-11-01 Apple 退件 ITMS-90474／90475：要宣告方向與啟動畫面。米說只做 iPhone 直向（.uiux）。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        # 片 C1：沒有這一句，第一次收音 iOS 會直接把 App 殺掉。文字照 .uiux/06-首次體驗.md 權限時刻表。
        NSMicrophoneUsageDescription: 米說需要用麥克風，把你說的話變成文字。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.misay
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # 只給 iPhone（1）。不宣告的話 Apple 用 iPad 多工規格審，ITMS-90023／90474／90475 都是這樣來的
        TARGETED_DEVICE_FAMILY: "1"

  MiSayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MiSayTests
    dependencies:
      - target: MiSay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.misay.MiSayTests
        # 模擬器版改 ad-hoc 自簽後，測試套件也要有 Info.plist 才簽得了；讓 Xcode 自己產
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MiSay:
    build:
      targets:
        MiSay: all
        MiSayTests: [test]
    test:
      config: Debug
      targets:
        - MiSayTests
