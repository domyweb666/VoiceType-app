# 米說 iOS（SwiftUI）的專案描述檔。Xcode 專案不進 repo，CI 用 XcodeGen 照這份產生。
# 名稱、Bundle ID、部署目標與 ios/README-release.md 的上架設定一致，片 A3 接簽章時不用改。
name: MiSay

options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "17.0" # 2026-10-31 米定：Tokens 的彈簧動畫與觸覺回饋是 iOS 17 的寫法

# 版號與 build 號放專案層：App 與小工具擴充要一致 App Store 才收，兩個 target 讀同一個值。
# CI 從 tag 與流水號帶入（ios-release.yml），這裡只是佔位。
settings:
  base:
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MiSay:
    type: application
    platform: iOS
    sources:
      - MiSay
      - MiSayShared
    dependencies:
      - target: MiSayWidgets
    # Info.plist 由 XcodeGen 每次產生（不進 repo）。
    info:
      path: MiSay/Info.plist
      properties:
        CFBundleDisplayName: 米說
        # 2026-11-02 米真機截圖：日期顯示成「Nov 2, 2026 at 1:26 AM」。沒宣告語言時 App 用英文格式與系統按鈕字。
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations:
          - zh-Hant
        # 版本與 build 號由 CI 從 tag 與流水號帶入（ios-release.yml）；本機預設值只是佔位
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 只用 HTTPS，出口合規免申報；沒這行每個 build 都要進 App Store Connect 手動回答
        ITSAppUsesNonExemptEncryption: false
        # 2026-11-01 Apple 退件 ITMS-90474／90475：要宣告方向與啟動畫面。米說只做 iPhone 直向（.uiux）。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        # 片 C1：沒有這一句，第一次收音 iOS 會直接把 App 殺掉。文字照 .uiux/06-首次體驗.md 權限時刻表。
        NSMicrophoneUsageDescription: 米說需要用麥克風，把你說的話變成文字。
        # 片 C3：鎖屏、切 App 照樣在錄（PRD「不弄丟剛講的話」）。只有 audio，沒有別的背景模式。
        UIBackgroundModes:
          - audio
        # 組塊 LA：鎖定畫面與靈動島的即時動態，要宣告在 App 這邊（不是擴充）。
        NSSupportsLiveActivities: true
        # K7：語音備忘錄、檔案 App 的分享表單裡出現米說，音檔送進來就收進待轉錄。只收副本，不就地改原檔。
        CFBundleDocumentTypes:
          - CFBundleTypeName: 音檔
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.misay
        # 只給 iPhone（1）。不宣告的話 Apple 用 iPad 多工規格審，ITMS-90023／90474／90475 都是這樣來的
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # 每個 target 一張描述檔，所以寫在這裡；放到 xcodebuild 命令列會套到所有 target，擴充會簽錯
        Release:
          PROVISIONING_PROFILE_SPECIFIER: MiSay App Store

  # 組塊 LA：即時動態與控制中心按鈕的小工具擴充，嵌在 App 裡一起上架。
  MiSayWidgets:
    type: app-extension
    platform: iOS
    sources:
      - MiSayWidgets
      - MiSayShared
    info:
      path: MiSayWidgets/Info.plist
      properties:
        CFBundleDisplayName: 米說
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations:
          - zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.misay.widgets
        TARGETED_DEVICE_FAMILY: "1"
        # 只跟著 App 走，不單獨裝進 archive
        SKIP_INSTALL: YES
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: MiSay Widgets App Store

  MiSayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MiSayTests
    dependencies:
      - target: MiSay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.misay.MiSayTests
        # 模擬器版改 ad-hoc 自簽後，測試套件也要有 Info.plist 才簽得了；讓 Xcode 自己產
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MiSay:
    build:
      targets:
        MiSay: all
        MiSayTests: [test]
    test:
      config: Debug
      targets:
        - MiSayTests
